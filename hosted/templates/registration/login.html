{% extends 'hosted/base.html' %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p class="muted">Use your local operator account to open the sample.</p>
<form class="panel" method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <input type="hidden" name="next" value="{{ next }}">
  <button>Sign in</button>
</form>
{% endblock %}
